packages:
  - vendor/*
  - packages/*/*
  - apps/*
  - native/system/packages/*

# Reviewed native installation hooks; source and licenses are checked separately.
allowBuilds:
  esbuild: true
  koffi: true
  node-pty: true

autoInstallPeers: false
strictPeerDependencies: true

# Upstream telemetry is a type closure only; keep its peer ranges compatible.
overrides:
  '@opentelemetry/api': '1.9.0'
