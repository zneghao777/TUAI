packages:
  - vendor/*
  - packages/*/*
  - apps/*
  - native/system/packages/*

# Reviewed native installation hooks; source and licenses are checked separately.
allowBuilds:
  esbuild: true
  koffi: true
  node-pty: true

autoInstallPeers: false
strictPeerDependencies: true

# Upstream telemetry is a type closure only; keep its peer ranges compatible.
overrides:
  '@opentelemetry/api': '1.9.0'
  'react': '19.2.9'
  'react-dom': '19.2.9'
  '@types/react': '19.2.17'
  '@types/react-dom': '19.2.7'

patchedDependencies:
  '@fortune-sheet/core@1.0.4': patches/@fortune-sheet__core@1.0.4.patch
  '@fortune-sheet/react@1.0.4': patches/@fortune-sheet__react@1.0.4.patch
  'exceljs@4.4.0': patches/exceljs@4.4.0.patch
  'lexical@0.49.0': patches/lexical@0.49.0.patch
  'node-pty@1.2.0-beta.15': patches/node-pty@1.2.0-beta.15.patch
