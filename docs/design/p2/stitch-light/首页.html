<!-- ==================== JAVASCRIPT: MICRO-INTERACTIONS & ATMOSPHERIC EFFECTS ==================== -->
<script>
    (function () {
      // 1. Mouse Follower Atmospheric Glow
      const glowNode = document.getElementById('cursor-glow');
      const composerCard = document.getElementById('composer-card');
      const promptInput = document.getElementById('prompt-input');
      const sendButton = document.getElementById('send-button');
      const promptChips = document.querySelectorAll('.prompt-chip');

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let currentX = mouseX;
      let currentY = mouseY;
      let isVisible = false;
      let animationFrameId = null;

      const hasReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

      function updateGlowPosition() {
        const dx = mouseX - currentX;
        const dy = mouseY - currentY;

        currentX += dx * 0.12;
        currentY += dy * 0.12;

        if (glowNode) {
          glowNode.style.transform = `translate3d(${currentX - 110}px, ${currentY - 110}px, 0)`;
        }

        // Specular proximity reflection on composer card
        if (composerCard) {
          const rect = composerCard.getBoundingClientRect();
          const distX = mouseX - (rect.left + rect.width / 2);
          const distY = mouseY - (rect.top + rect.height / 2);
          const distance = Math.hypot(distX, distY);

          if (distance < 450) {
            const intensity = Math.max(0, 1 - distance / 450);
            const lightX = ((mouseX - rect.left) / rect.width) * 100;
            const lightY = ((mouseY - rect.top) / rect.height) * 100;
            composerCard.style.boxShadow = `inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 ${8 + intensity * 6}px ${32 + intensity * 8}px -4px rgba(40, 45, 53, ${0.05 + intensity * 0.03}), 0 1px 3px rgba(40, 45, 53, 0.04)`;
            composerCard.style.background = `radial-gradient(circle at ${lightX}% ${lightY}%, rgba(255, 255, 255, 0.88) 0%, rgba(255, 255, 255, 0.74) 70%)`;
          } else {
            composerCard.style.background = 'rgba(255, 255, 255, 0.76)';
            composerCard.style.boxShadow = 'inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 8px 32px -4px rgba(40, 45, 53, 0.05), 0 1px 3px rgba(40, 45, 53, 0.04)';
          }
        }

        if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
          animationFrameId = requestAnimationFrame(updateGlowPosition);
        } else {
          animationFrameId = null;
        }
      }

      function startAnimation() {
        if (!animationFrameId) {
          animationFrameId = requestAnimationFrame(updateGlowPosition);
        }
      }

      if (!hasReducedMotion && !isTouchDevice && glowNode) {
        window.addEventListener('pointermove', (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          if (!isVisible) {
            glowNode.classList.remove('opacity-0');
            glowNode.classList.add('opacity-100');
            isVisible = true;
          }
          startAnimation();
        });

        window.addEventListener('mouseleave', () => {
          glowNode.classList.remove('opacity-100');
          glowNode.classList.add('opacity-0');
          isVisible = false;
        });
      }

      // 2. Interactive Input State & Send Activation
      if (promptInput && sendButton) {
        promptInput.addEventListener('input', () => {
          const val = promptInput.value.trim();
          if (val.length > 0) {
            sendButton.removeAttribute('disabled');
            sendButton.classList.remove('bg-[#536985]/15', 'text-[#536985]/40', 'cursor-not-allowed');
            sendButton.classList.add('bg-[#536985]', 'hover:bg-[#4a5e78]', 'active:bg-[#445A75]', 'text-white', 'shadow-[0_2px_8px_rgba(83,105,133,0.25)]', 'cursor-pointer', 'hover:-translate-y-[1px]');
          } else {
            sendButton.setAttribute('disabled', 'true');
            sendButton.classList.add('bg-[#536985]/15', 'text-[#536985]/40', 'cursor-not-allowed');
            sendButton.classList.remove('bg-[#536985]', 'hover:bg-[#4a5e78]', 'active:bg-[#445A75]', 'text-white', 'shadow-[0_2px_8px_rgba(83,105,133,0.25)]', 'cursor-pointer', 'hover:-translate-y-[1px]');
          }
        });

        // Auto-fill prompt when prompt-chips are clicked
        promptChips.forEach(chip => {
          chip.addEventListener('click', () => {
            promptInput.value = chip.innerText.trim();
            promptInput.focus();
            promptInput.dispatchEvent(new Event('input'));
          });
        });
      }

      // 3. Command+N Shortcut for New Chat
      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') {
          e.preventDefault();
          if (promptInput) {
            promptInput.value = '';
            promptInput.focus();
            promptInput.dispatchEvent(new Event('input'));
          }
        }
      });
    })();
  </script>
</body></html>
